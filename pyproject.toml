[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-signal-sdk"
version = "0.2.2"
description = "Developer SDK for validating and publishing trading signals"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
  { name = "Marcus SDK Team", email = "dev@marcus.io" }
]
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.7,<3.0",
  "requests>=2.32,<3.0",
  "urllib3>=2.2,<3.0",
]


[project.urls]
Homepage = "https://github.com/marcusio/quant-signal-sdk"
Repository = "https://github.com/marcusio/quant-signal-sdk"
Issues = "https://github.com/marcusio/quant-signal-sdk/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-mock>=3.10",
  "pyright>=1.1",
  "build>=1.0",
  "twine>=4.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "pyarrow>=15.0,<21.0",
  "joblib>=1.3,<2.0",
  "lightgbm>=4.3,<5.0",
  "scikit-learn>=1.4,<2.0",
]

market-data = [
  "pandas>=2.2,<3.0",
  "ccxt>=4.0,<6.0",
  "pyarrow>=15.0,<21.0",
]

backtest = [
  "pandas>=2.2,<3.0",
]

ml = [
  "joblib>=1.3,<2.0",
  "lightgbm>=4.3,<5.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.4,<2.0",
]

[project.scripts]
quant-sdk = "quant_signal_sdk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src"]
